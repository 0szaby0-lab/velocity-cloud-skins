<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocity Radar Share</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f1115;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #radar-container {
            position: relative;
            width: 800px;
            height: 800px;
            background-color: #1a1c23;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        #map-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0.7;
        }

        .player-dot {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            transition: left 0.1s linear, top 0.1s linear;
        }

        .player-dot.t {
            background-color: #ff5c5c;
            box-shadow: 0 0 10px #ff5c5c;
        }

        .player-dot.ct {
            background-color: #5c9aff;
            box-shadow: 0 0 10px #5c9aff;
        }

        .player-dot.dead {
            background-color: #555;
            box-shadow: none;
            opacity: 0.5;
            z-index: 5;
        }

        .player-info {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            white-space: nowrap;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hp-bar-bg {
            width: 30px;
            height: 3px;
            background: #333;
            border-radius: 2px;
            margin-top: 2px;
            overflow: hidden;
        }

        .hp-bar-fill {
            height: 100%;
            background: #4caf50;
            width: 100%;
        }
        
        #status-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 20;
            background: rgba(0,0,0,0.6);
            padding: 10px;
            border-radius: 8px;
            backdrop-filter: blur(4px);
        }
        
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
            background-color: #ffcc00;
        }
        
        .connected { background-color: #4caf50; }
        .disconnected { background-color: #f44336; }
    </style>
</head>
<body>
    <div id="radar-container">
        <div id="status-overlay">
            <span class="status-dot disconnected" id="conn-dot"></span>
            <span id="conn-text">Connecting...</span>
            <div id="map-name" style="margin-top: 5px; font-weight: bold; color: #aaa;">Map: Unknown</div>
        </div>
        <img id="map-image" src="" alt="Waiting for map data..." style="display: none;">
        <div id="players-layer"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session');
        
        const connDot = document.getElementById('conn-dot');
        const connText = document.getElementById('conn-text');
        const mapNameEl = document.getElementById('map-name');
        const mapImage = document.getElementById('map-image');
        const playersLayer = document.getElementById('players-layer');

        let ws;

        if (!sessionId) {
            connText.innerText = "Error: Missing session ID in URL";
        } else {
            connectWs();
        }
        const MAP_CONFIGS = {
            "de_dust2": { x: -2476, y: 3239, scale: 4.4 },
            "de_mirage": { x: -3217, y: 1713, scale: 5.0 },
            "de_inferno": { x: -2087, y: 3870, scale: 4.9 },
            "de_vertigo": { x: -3168, y: 1762, scale: 4.0 },
            "de_nuke": { x: -3453, y: 2887, scale: 7.0 },
            "de_ancient": { x: -2953, y: 2164, scale: 5.0 },
            "de_anubis": { x: -2796, y: 3328, scale: 5.2 }
        };

        function connectWs() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/radar-ws?session=${sessionId}`;
            
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                connDot.className = "status-dot connected";
                connText.innerText = "Live";
            };

            ws.onclose = () => {
                connDot.className = "status-dot disconnected";
                connText.innerText = "Disconnected. Reconnecting...";
                setTimeout(connectWs, 2000);
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    updateRadar(data);
                } catch (e) {
                    console.error("Invalid WS data", e);
                }
            };
        }

        let currentMap = "";

        function updateRadar(data) {
            if (data.map && data.map !== currentMap) {
                currentMap = data.map;
                mapNameEl.innerText = `Map: ${currentMap}`;
                
                mapImage.src = `https://raw.githubusercontent.com/MurkyYT/cs2-map-icons/main/images/${currentMap}.png`;
                mapImage.style.display = 'block';
                mapImage.onerror = () => {
                    mapImage.style.display = 'none';
                    mapNameEl.innerText += " (Image not found)";
                };
            }

            const mapConfig = MAP_CONFIGS[currentMap];
            if (!mapConfig) return;

            const newIds = new Set(data.players.map(p => p.name));
            Array.from(playersLayer.children).forEach(el => {
                if (!newIds.has(el.dataset.id)) {
                    el.remove();
                }
            });

            data.players.forEach(p => {
                let screenX = (p.x - mapConfig.x) / mapConfig.scale;
                let screenY = (mapConfig.y - p.y) / mapConfig.scale;
                
                const posX = (screenX / 1024) * 100;
                const posY = (screenY / 1024) * 100;

                let el = document.getElementById(`player-${p.name}`);
                if (!el) {
                    el = document.createElement('div');
                    el.id = `player-${p.name}`;
                    el.dataset.id = p.name;
                    el.className = 'player-dot';
                    
                    const info = document.createElement('div');
                    info.className = 'player-info';
                    
                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'name-text';
                    info.appendChild(nameSpan);
                    
                    const hpBarBg = document.createElement('div');
                    hpBarBg.className = 'hp-bar-bg';
                    const hpBarFill = document.createElement('div');
                    hpBarFill.className = 'hp-bar-fill';
                    hpBarBg.appendChild(hpBarFill);
                    info.appendChild(hpBarBg);
                    
                    el.appendChild(info);
                    playersLayer.appendChild(el);
                }

                el.style.left = `${posX}%`;
                el.style.top = `${posY}%`;
                
                if (!p.alive) {
                    el.className = 'player-dot dead';
                } else if (p.team === 2) {
                    el.className = 'player-dot t';
                } else if (p.team === 3) {
                    el.className = 'player-dot ct';
                } else {
                    el.className = 'player-dot';
                }

                const nameEl = el.querySelector('.name-text');
                nameEl.innerText = p.name;
                
                const hpFill = el.querySelector('.hp-bar-fill');
                hpFill.style.width = `${Math.min(100, Math.max(0, p.health))}%`;
                hpFill.style.background = p.health > 50 ? '#4caf50' : (p.health > 20 ? '#ff9800' : '#f44336');
            });
        }
    </script>
</body>
</html>
